<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Todo App (Node + MySQL)</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">📝 Todo App</h1>
        <div id="alertBox"></div>

        <!-- FILTER BAR -->
        <div class="row mb-3">
            <div class="col-md-5">
                <input type="text" id="searchInput" class="form-control" placeholder="Search todo..."
                    onkeydown="handleEnter(event)">
            </div>

            <div class="col-md-4">
                <input type="date" id="dateFilter" class="form-control">
            </div>

            <div class="col-md-3">
                <button class="btn btn-dark w-100" onclick="getTodos()">Search</button>
                <button class="btn btn-secondary w-100" onclick="clearFilters()">Clear</button>

            </div>
        </div>

        <!-- ADD TODO -->
        <div class="card mb-4">
            <div class="card-body">
                <input type="text" id="title" class="form-control" placeholder="Enter todo (max 10 words)"
                    oninput="updateWordCount()">
                <small id="wordCounter" class="text-muted">
                    Words: 0 /10
                </small>

                <button class="btn btn-primary mt-2" onclick="addTodo()">Add Todo</button>
            </div>
        </div>

        <!-- TODO TABLE -->
        <div class="card">
            <div class="card-body">

                <table class="table table-bordered table-striped text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Todo</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="todoList">
                        <!-- rows JS se aayengi -->
                    </tbody>
                </table>

                <!-- PAGINATION -->
                <nav>
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- buttons JS se -->
                    </ul>
                </nav>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
